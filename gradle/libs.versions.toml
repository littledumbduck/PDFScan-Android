[versions]
agp = "9.4.1"
kotlin = "2.4.0"
composeBom = "2026.09.00"
activityCompose = "1.13.0"
lifecycle = "2.11.0"
coreKtx = "1.19.1"
materialIconsExtended = "1.7.8"
exifinterface = "1.4.1"
